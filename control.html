<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Doomy · Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="celular fija">
  <p id="mensaje" class="aviso"></p>

  <!-- 1. Unirse a una sala -->
  <section id="vista-unirse">
    <h1>Doomy plays DOOM</h1>
    <form id="form-unirse">
      <p>
        <label>Sala<br><input id="sala" autocomplete="off" autocapitalize="characters" maxlength="8" required></label>
      </p>
      <p>
        <label>Tu nombre<br><input id="nombre" autocomplete="nickname" maxlength="20" required></label>
      </p>
      <p><button type="submit">Unirse</button></p>
    </form>
  </section>

  <!-- 2. Lobby y pausa general: elegir controles, sensores y ajustes.
       Al tocar "Estoy listo" pasa a la fase de calibración (panel de ajustes). -->
  <section id="vista-lobby" hidden>
    <header class="cabecera">
      <strong id="titulo-lobby">Lobby</strong> · Sala <strong id="lobby-sala"></strong>
      <p id="motivo-pausa" class="error"></p>
    </header>

    <!-- Pestañas: se ocultan durante la calibración -->
    <nav id="pestanas" class="pestanas">
      <button type="button" data-pestana="controles" class="activa">Controles</button>
      <button type="button" data-pestana="ajustes">Ajustes</button>
    </nav>

    <div id="panel-controles" class="panel">
      <button type="button" id="activar-sensores" hidden>Activar sensores de movimiento</button>
      <ul id="lista-controles" class="filas"></ul>
    </div>

    <div id="panel-ajustes" class="panel" hidden>
      <div class="botones-ajustes">
        <button type="button" id="recalibrar">Recalibrar</button>
        <button type="button" id="restablecer">Valores por defecto</button>
      </div>
      <div id="lista-invertir"></div>
      <div id="lista-ajustes"></div>
    </div>

    <footer class="pie">
      <p id="ayuda-control" class="aviso">Toca un control para ver su gesto. No puedes tener dos controles que interfieran.</p>
      <div class="botones-pie">
        <button type="button" id="volver-calibracion" hidden>Volver</button>
        <button type="button" id="listo" class="boton-listo">Estoy listo</button>
      </div>
    </footer>
  </section>

  <!-- 3. Partida -->
  <section id="vista-juego" hidden>
    <!-- Solo elementos táctiles: los controles con sensores no muestran nada -->
    <div id="zona-tactil" class="zona-tactil" hidden>
      <div id="joystick-base" class="joystick-base" hidden></div>
      <div id="joystick-perilla" class="joystick-perilla" hidden></div>
    </div>

    <!-- Abajo: Mapa en la esquina izquierda y el carrusel de armas -->
    <div class="barra-inferior">
      <button type="button" id="boton-mapa" class="boton-mapa tactil" hidden>Mapa</button>
      <div id="carrusel" class="carrusel" hidden>
        <button type="button" id="arma-anterior" class="tactil">◀</button>
        <span id="arma-actual"></span>
        <button type="button" id="arma-siguiente" class="tactil">▶</button>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script src="control.js"></script>
</body>
</html>
